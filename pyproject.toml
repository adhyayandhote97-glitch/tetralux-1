[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tetralux"
version = "0.1.0"
description = "Digital twin of a CubeSat sun-direction estimation system (Tetralux-1)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Adhyayan Dhote" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/tetralux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
